<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2346d47e' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-aviao" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
  <symbol id="i-seta" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-enviar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></g></symbol>
  <symbol id="i-config" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
  <symbol id="i-atualizar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></g></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-olho" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></g></symbol>
  <symbol id="i-externo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></g></symbol>
</svg>

<header class="topo">
  <div class="marca"><svg class="marca-ico"><use href="#i-aviao"/></svg><span>Rasante</span></div>
  <form class="busca" id="busca" autocomplete="off">
    <svg class="busca-ico"><use href="#i-busca"/></svg>
    <label>Origem <span class="col">[</span><input id="origem" maxlength="3" list="aeroportos" value="BEL" aria-label="Origem"><span class="col">]</span></label>
    <label>Destino <span class="col">[</span><input id="destino" maxlength="3" list="aeroportos" value="GRU" aria-label="Destino"><span class="col">]</span></label>
    <label>Ida <span class="col">[</span><button type="button" class="data" id="ida-btn" data-alvo="ida"></button><input type="date" id="ida" class="data-oculta" tabindex="-1"><span class="col">]</span></label>
    <label>Volta <span class="col">[</span><button type="button" class="data" id="volta-btn" data-alvo="volta"></button><input type="date" id="volta" class="data-oculta" tabindex="-1"><button type="button" class="limpar" id="volta-limpar" title="Sem volta" aria-label="Tirar a volta"><svg><use href="#i-fechar"/></svg></button><span class="col">]</span></label>
    <button type="submit" class="cacar" id="cacar"><span class="col">[</span> Caçar <span class="col">]</span></button>
  </form>
  <button class="icone-btn" id="abrir-config" title="Configurações" aria-label="Configurações"><svg><use href="#i-config"/></svg></button>
  <datalist id="aeroportos"></datalist>
</header>

<div class="rasante" aria-hidden="true">
  <svg id="cena" viewBox="0 0 1376 135" preserveAspectRatio="none"></svg>
</div>

<main class="corpo">
  <section class="lista-area">
    <div class="resumo" id="resumo" hidden></div>
    <div class="lista" id="lista"></div>
  </section>
  <aside class="vigia">
    <h2>ROTAS VIGIADAS</h2>
    <div id="vigias"></div>
    <p class="aviso-tg" id="aviso-tg"><b>Aviso:</b> <svg><use href="#i-enviar"/></svg> <span id="aviso-tg-txt">Notificar no Telegram</span></p>
  </aside>
</main>

<footer class="rodape">Rasante v0.1 | Caçando as melhores falhas</footer>

<div class="modal-fundo" id="modal-fundo" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-topo"><h3 id="modal-titulo"></h3><button class="icone-btn" data-fechar aria-label="Fechar"><svg><use href="#i-fechar"/></svg></button></div>
    <div class="modal-corpo" id="modal-corpo"></div>
    <div class="modal-acoes" id="modal-acoes"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js?v=1"></script>
</body>
</html>
